appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "J"
- tapOn:
    text: "NanoflowCommons"
- tapOn:
    text: "Client activities"
- tapOn:
    text: "Confirmation"
- tapOn:
    id: "container1"
- inputText: "11"
# iOS: dismiss the keyboard first — every XCUITest hang in CI (viewHierarchy timing out) came with
# the keyboard up. Android-only hideKeyboard is a Back press, so it stays iOS-scoped.
- runFlow:
    when:
      platform: ios
    commands:
      - hideKeyboard
- tapOn: "Show confirmation "
- assertVisible: "Yolo"
- assertVisible: "11"
- tapOn: "OK"
- assertVisible: "Confirmed!"


