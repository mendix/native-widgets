appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "P"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Popup menu"
    timeout: 10000
- tapOn:
    text: "Popup menu"
- tapOn:
    text: "Combinations"
- assertVisible:
    text: "Withcontainer"
- tapOn: "Go back"
- tapOn:
    text: "Basic"
- tapOn:
    text: "Alert"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/popup_menu_alert"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/popup_menu_alert.png"


