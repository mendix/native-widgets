appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "S"
      - extendedWaitUntil:
          visible: "Signature"
          timeout: 10000
- tapOn:
    text: "Signature"
- swipe:  
    start: 50%, 36% 
    end: 10%, 75% 
- tapOn:
    text: "Clear"
- assertVisible: 
    text: "Signature"
- swipe:  
    start: 50%, 36% 
    end: 10%, 75% 
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: 
        text: "Base64"
    timeout: 30000
    optional: true
