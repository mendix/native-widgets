appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "S"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Signature"
    timeout: 10000
- tapOn:
    text: "Signature"
- swipe:  
    start: 50%, 36% 
    end: 10%, 75% 
- tapOn:
    text: "Clear"
- assertVisible: 
    text: "Signature"
- swipe:  
    start: 50%, 36% 
    end: 10%, 75% 
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: 
        text: "Base64"
    timeout: 30000
    optional: true
