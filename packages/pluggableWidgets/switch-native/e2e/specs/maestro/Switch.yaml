appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "S"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Switch"
    timeout: 10000
- tapOn:
    text: "Switch"
- assertNotVisible: 
    text: "I will present myself when the boolean is True"
- tapOn:
    id: "switch1"
- assertVisible: 
    text: "I will present myself when the boolean is True"
