appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "L"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "List view swipe"
    timeout: 10000
- tapOn:
    text: "List view swipe"
- assertVisible:
    text: "Actions"
- assertVisible:
    text: "Test 1"
- tapOn:
    text: "Buttons"
- assertVisible:
    text: "Test 1"
