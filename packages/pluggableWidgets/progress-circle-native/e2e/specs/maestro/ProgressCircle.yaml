appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "P"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Progress circle"
    timeout: 10000
- tapOn:
    text: "Progress circle"
- assertVisible:
    text: "With default text:"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/progress_circle"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/progress_circle.png"
