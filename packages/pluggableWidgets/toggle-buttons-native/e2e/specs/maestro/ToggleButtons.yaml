appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "T"
      - extendedWaitUntil:
          visible: "Toggle buttons"
          timeout: 10000
- tapOn: 
    text: "Toggle buttons"
- assertVisible: 
    text: "Default:"
# Wait for the screen to stop changing (image decode / sheet animation)
# rather than sleeping a fixed time: this returns as soon as the UI
# settles, and still caps at 15s.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/toggle_buttons"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/toggle_buttons.png"
