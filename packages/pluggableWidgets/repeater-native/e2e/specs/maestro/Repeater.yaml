appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "R"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Repeater"
    timeout: 10000
- tapOn:
    text: "Repeater"
- assertVisible:
    text: "FirstName 1"
    index: 0
- assertVisible:
    text: "Nested Repeater"
- assertVisible:
    text: "Hello"
    index: 2
- assertVisible:
    text: "hello"
    index: 7
