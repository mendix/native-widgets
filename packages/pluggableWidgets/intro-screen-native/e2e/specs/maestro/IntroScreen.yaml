appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "I"
- tapOn:
    text: "Intro screen"
# Opening the page mounts the widget and waits on the runtime, unlike the in-flow waits
# below which only cover an on-device slide transition. 5s was flaky on the CI simulator
# (3 vCPU, shared with the Mendix runtime JVM); 15s matches the repo's usual budget.
- extendedWaitUntil:
    visible: "Active slide: 2"
    timeout: 15000
- assertVisible:
    text: "Changes: 0"
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible: "Active slide: 3"
    timeout: 5000
- assertVisible:
    text: "Changes: 1"
- swipe:
    direction: RIGHT
- extendedWaitUntil:
    visible: "Active slide: 2"
    timeout: 5000
- assertVisible:
    text: "Changes: 2"
- tapOn:
    text: "PREVIOUS"
- extendedWaitUntil:
    visible: "Active slide: 1"
    timeout: 5000
- assertVisible:
    text: "Changes: 3"
- tapOn:
    text: "SKIP"
- extendedWaitUntil:
    visible: "Skipped"
    timeout: 5000
- tapOn:
    text: "OK"
- tapOn: "Go back"
- tapOn:
    text: "Intro screen"
# Re-entry remounts the widget, which must reposition to the attribute's slide — same
# page-entry cost as the first open, so the same 15s budget rather than 5s.
- extendedWaitUntil:
    visible: "Active slide: 2"
    timeout: 15000
- tapOn:
    text: "NEXT"
- extendedWaitUntil:
    visible: "Active slide: 3"
    timeout: 5000
- tapOn:
    text: "FINISH"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000