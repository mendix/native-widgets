appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "W"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Web view"
    timeout: 10000
- tapOn: 
    text: "Web view"
- tapOn: 
    text: "Events"
- extendedWaitUntil:
    visible: "URL loaded"
    timeout: 30000
- tapOn: 
    text: "OK"
- tapOn: 
    text: "Invalid URL"
- extendedWaitUntil:
    visible: "Error"
    timeout: 30000