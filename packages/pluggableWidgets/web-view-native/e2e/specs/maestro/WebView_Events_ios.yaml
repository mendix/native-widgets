appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "W"
      - extendedWaitUntil:
          visible: "Web view"
          timeout: 10000
- tapOn: 
    text: "Web view"
- tapOn: 
    text: "Events"
- extendedWaitUntil:
    visible: "URL loaded"
    timeout: 30000
# The page starts on the app's own web client, which fires On load several times while it
# loads, and every On load stacks another blocking "URL loaded" alert. Dismiss all of them,
# otherwise the tap on "Invalid URL" lands behind the remaining alerts.
- repeat:
    while:
      visible: "URL loaded"
    commands:
      - tapOn:
          text: "OK"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Invalid URL"
- extendedWaitUntil:
    visible: "Error"
    timeout: 30000