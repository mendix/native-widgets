appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "B"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Badge"
    timeout: 10000
- tapOn:
    text: "Badge"
- tapOn:
    id: "textBoxBadge"
- inputText:
    text: "Maestro"
- pressKey: Enter
- assertVisible:
    text: "Maestro"
    index: 1
# does not render the badge with visibility set as false
- assertNotVisible:
    id: "badgeNoVisibility"
# renders the badge with actions
- tapOn:
    text: "Maestro"
    index: 2
- assertVisible:
    text: "Action test: Maestro"
