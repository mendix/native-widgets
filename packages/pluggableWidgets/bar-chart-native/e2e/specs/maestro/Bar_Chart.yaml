appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "B"
      - extendedWaitUntil:
          visible: "Bar chart"
          timeout: 10000
- tapOn:
    text: "Bar chart"
- assertVisible:
    text: "Bar chart"
- assertVisible:
    id: "container1"
# Wait for the screen to stop changing (image decode / sheet animation)
# rather than sleeping a fixed time: this returns as soon as the UI
# settles, and still caps at 15s.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/bar_chart"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/bar_chart.png"

