appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "R"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Range slider"
    timeout: 10000
- tapOn:
    text: "Range slider"
- assertVisible:
    text: "Dynamic ranges"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/range_slider"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/range_slider.png"
