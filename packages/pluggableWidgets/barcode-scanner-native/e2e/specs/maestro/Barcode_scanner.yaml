appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "B"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Barcode scanner"
    timeout: 10000
- tapOn:
    text: "Barcode scanner"
- assertVisible:
    id: "text2" # History:
- tapOn:
    text: "Scan"
- extendedWaitUntil:
    visible: 
        text: "Scan"
    timeout: 30000
