appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "S"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Slider"
    timeout: 10000
- tapOn:
    text: "Slider"
- assertVisible: "Dynamic ranges"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/slider"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/slider.png"
