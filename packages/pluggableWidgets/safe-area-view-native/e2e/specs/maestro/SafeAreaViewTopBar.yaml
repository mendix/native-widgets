appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "S"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Safe area view"
    timeout: 10000
- tapOn:
    text: "Safe area view"
- tapOn:
    text: "Top bar"
- assertVisible: "Expected result:\r

    \ - Safe area has an orange background color\r

    \ - Safe area starts directly below header"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/safe_area_view_top_bar"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/safe_area_view_top_bar.png"
