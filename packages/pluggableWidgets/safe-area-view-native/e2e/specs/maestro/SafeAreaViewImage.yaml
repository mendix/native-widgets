appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "S"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Safe area view"
    timeout: 10000
- tapOn:
    text: "Safe area view"
- tapOn:
    text: "Image"
- assertVisible:
    id: "image1"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/safe_area_view_image"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/safe_area_view_image.png"
