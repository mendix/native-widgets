appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "C"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Carousel"
    timeout: 10000
- tapOn:
    text: "Carousel"
- swipe:
    from:
      text: "Logo"
    direction: LEFT
- assertVisible:
    text: "Office"
- swipe:
    from:
      text: "Office"
    direction: LEFT
- assertVisible:
    text: "Fish"
