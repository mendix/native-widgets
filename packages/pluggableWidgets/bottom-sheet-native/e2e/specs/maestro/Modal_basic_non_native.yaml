appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "B"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Bottom Sheet"
    timeout: 10000
- tapOn:
    text: "Bottom Sheet"
- tapOn:
    text: "Modal basic non native"
# Wait for the page to fully load before tapping Open
- extendedWaitUntil:
    visible: "Open"
    timeout: 10000
- tapOn:
    text: "Open"

# Wait for the screen to stop changing (image decode / sheet animation)
# rather than sleeping a fixed time: this returns as soon as the UI
# settles, and still caps at 25s.
- waitForAnimationToEnd:
    timeout: 25000

- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/bottom_sheet_modal_basic_non_native"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/bottom_sheet_modal_basic_non_native.png"
