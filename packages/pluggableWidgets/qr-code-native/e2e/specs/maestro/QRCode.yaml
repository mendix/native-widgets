appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "Q"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "QR code"
    timeout: 10000
- tapOn:
    text: "QR code"
- assertVisible:
    id: "qRCodeNormal"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/qr_code"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/qr_code.png"
