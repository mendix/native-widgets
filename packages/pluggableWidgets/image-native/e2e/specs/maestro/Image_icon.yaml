appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "I"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Image"
    timeout: 10000
- tapOn:
    text: "Image"
- tapOn:
    text: "Image icon"
- assertVisible:
    text: "Image Icon"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/image_icon"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/image_icon.png"
