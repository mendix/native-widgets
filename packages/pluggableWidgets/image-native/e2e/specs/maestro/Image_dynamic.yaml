appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "I"
      - extendedWaitUntil:
          visible: "Image"
          timeout: 10000
- tapOn:
    text: "Image"
- tapOn:
    text: "Image dynamic"
# Wait for the screen to stop changing (image decode / sheet animation)
# rather than sleeping a fixed time: this returns as soon as the UI
# settles, and still caps at 30s.
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/image_dynamic"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/image_dynamic.png"
