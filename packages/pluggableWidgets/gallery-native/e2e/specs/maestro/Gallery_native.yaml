appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "G"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Gallery"
    timeout: 10000
- tapOn:
    text: "Gallery"
- tapOn:
    text: "Gallery"
- assertNotVisible:
    text: ".*Title 5.*"
- tapOn:
    text: "Load more"
- assertVisible:
    text: ".*Title 5.*"
- swipe:
    from:
      text: ".*Title 5.*"
    direction: UP
- assertVisible:
    text: ".*Title 9.*"
- tapOn:
    text: "Load more"
- assertVisible:
    text: ".*Title 10.*"
- swipe:
    from:
      text: ".*Title 10.*"
    direction: UP
- assertVisible:
    text: ".*Title 14.*"