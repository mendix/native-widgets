appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "P"
      - extendedWaitUntil:
          visible: "Pie doughnut chart"
          timeout: 10000
- tapOn:
    text: "Pie doughnut chart"
- tapOn:
    text: "Pie chart Custom style"
- assertVisible:
    id: "container1"
- assertVisible:
    id: "innerView"
# Wait for the screen to stop changing (image decode / sheet animation)
# rather than sleeping a fixed time: this returns as soon as the UI
# settles, and still caps at 15s.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/pie_chart_custom"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/pie_chart_custom.png"
