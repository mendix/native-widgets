appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- tapOn:
    text: "R"
# Tapping the alphabet index re-renders the widget list; wait for the
# entry before tapping it, otherwise the tap races that render.
- extendedWaitUntil:
    visible: "Radio buttons"
    timeout: 10000
- tapOn:
    text: "Radio buttons"
- assertVisible:
    text: "Vertical radio buttons"
- takeScreenshot:
    path: "maestro/images/actual/${PLATFORM}/radio_buttons"
- assertScreenshot:
    path: "maestro/images/expected/${PLATFORM}/radio_buttons.png"
