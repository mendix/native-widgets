appId: "${APP_ID}"
---
- runFlow:
    file: "../../../../../../maestro/Precondition.yaml"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "G"
      - extendedWaitUntil:
          visible: "Gallery"
          timeout: 10000
- tapOn:
    text: "Gallery"
- tapOn:
    text: "Gallery text filter"
- assertVisible:
    text: "Title 0"
- tapOn:
    id: "textFilter1-text-input"
- inputText:
    text: "Title 5"
- pressKey: Enter
# iOS: dismiss the keyboard before reading the hierarchy — every XCUITest hang in CI (viewHierarchy
# timing out) came with the keyboard up. Android-only hideKeyboard is a Back press, so it stays iOS-scoped.
- runFlow:
    when:
      platform: ios
    commands:
      - hideKeyboard
- assertVisible:
    text: "Title 5"
    index: 1
- tapOn:
    id: "textFilter1-text-input"
- eraseText
- inputText:
    text: "Title 100"
- pressKey: Enter
- runFlow:
    when:
      platform: ios
    commands:
      - hideKeyboard
- assertVisible:
    text: "No results found"
